<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    font-family: "Malgun Gothic", "맑은 고딕", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }

  .card {
    position: relative;
    box-sizing: border-box;
    width: calc(100% - 10px);
    height: calc(100% - 10px);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 16px;
    background: #ffffff;
    border: 1px solid rgba(10, 20, 40, .08);
    box-shadow: 0 12px 30px rgba(16, 24, 40, .22);
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px) scale(.97);
    transition: opacity .18s ease, transform .18s ease;
  }
  .card.show { opacity: 1; transform: translateY(0) scale(1); }
  .card.out { opacity: 0; transform: translateY(8px) scale(.97); }

  .mark {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: #3F9BFF;
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    display: grid;
    place-items: center;
  }

  .grow { flex: 1 1 auto; min-width: 0; }

  .title {
    font-size: 14px;
    font-weight: 700;
    color: #141A24;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .body {
    margin-top: 4px;
    font-size: 13px;
    line-height: 1.45;
    color: #4A5361;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  .x {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #8B93A1;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .x:hover { background: rgba(0, 0, 0, .06); color: #4A5361; }

  @media (prefers-color-scheme: dark) {
    .card { background: #1A1B26; border-color: rgba(255, 255, 255, .08); box-shadow: 0 12px 30px rgba(0, 0, 0, .5); }
    .title { color: #EDEFF6; }
    .body { color: #A3AABC; }
    .x { color: #7C8496; }
    .x:hover { background: rgba(255, 255, 255, .1); color: #EDEFF6; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="mark">E</div>
    <div class="grow">
      <div class="title" id="title">에듀톡</div>
      <div class="body" id="body"></div>
    </div>
    <button class="x" id="close" type="button" aria-label="닫기">✕</button>
  </div>
  <script>
    (function () {
      var api = window.edutalkDesktop || {};
      var card = document.getElementById('card');
      var titleEl = document.getElementById('title');
      var bodyEl = document.getElementById('body');
      var closeBtn = document.getElementById('close');
      var currentRoomId = '';
      var hideTimer = null;

      function show(payload) {
        currentRoomId = (payload && payload.roomId) || '';
        titleEl.textContent = (payload && payload.title) || '에듀톡';
        bodyEl.textContent = (payload && payload.body) || '';
        card.classList.remove('out');
        void card.offsetWidth; // 애니메이션이 다시 재생되도록 강제로 다시 그린다
        card.classList.add('show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          card.classList.remove('show');
          card.classList.add('out');
        }, 5400);
      }

      if (api.onNotifyShow) api.onNotifyShow(show);

      card.addEventListener('click', function (event) {
        if (event.target === closeBtn) return;
        if (api.notifyAction) api.notifyAction('open', currentRoomId);
      });

      closeBtn.addEventListener('click', function (event) {
        event.stopPropagation();
        if (api.notifyAction) api.notifyAction('close', '');
      });
    })();
  </script>
</body>
</html>
