name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - "edutalk-core/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: edutalk-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edutalk-core/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Breeze installer
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: breeze-windows-installer
          path: edutalk-core/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
